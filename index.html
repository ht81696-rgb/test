<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô Phỏng Tài Xỉu Cao Cấp</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            width: 450px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #ffdf00, #ff4e50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* Khu vực hiển thị số dư và lịch sử */
        .status-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            font-size: 16px;
            background: rgba(255,255,255,0.05);
            padding: 10px 15px;
            border-radius: 10px;
        }

        .balance { color: #00ffcc; font-weight: bold; }

        /* Khung chứa 3 viên xí ngầu (Xúc xắc) */
        .dice-area {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
            height: 70px;
        }

        /* Thiết kế viên xúc xắc đổ bóng 3D */
        .dice {
            width: 65px;
            height: 65px;
            background-color: #fff;
            border-radius: 12px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 6px;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.2), 0 10px 20px rgba(0,0,0,0.4);
            transition: transform 0.5s ease;
        }

        /* Các chấm tròn trên xúc xắc */
        .dot {
            background-color: #333;
            border-radius: 50%;
            width: 10px;
            height: 10px;
            margin: auto;
            align-self: center;
            justify-self: center;
        }
        /* Viên xúc xắc có nút đỏ cho đẹp mắt */
        .dice .red-dot { background-color: #ff2a2a; width: 12px; height: 12px;}

        /* Hiệu ứng rung lắc khi quay xúc xắc */
        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-10deg); }
            20% { transform: translate(-3px, 0px) rotate(10deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(5deg); }
            50% { transform: translate(-1px, 2px) rotate(-5deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-10deg); }
            80% { transform: translate(-1px, -1px) rotate(10deg); }
            90% { transform: translate(2px, 2px) rotate(5deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }

        .shaking {
            animation: shake 0.15s infinite;
        }

        /* Khu vực đặt cược cửa Tài / Xỉu */
        .bet-zones {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .bet-btn {
            flex: 1;
            padding: 20px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.02);
            color: white;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
