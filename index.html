<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng Game Dự Đoán Siêu Cấp</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background: #09090e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .game-board {
            background: linear-gradient(135deg, #141526 0%, #0f101d 100%);
            border: 1px solid #252847;
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.8);
        }

        /* Thanh thông tin người chơi */
        .header-wallet {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1c1d33;
            padding: 12px 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid #2e3154;
        }

        .username { color: #8f94cb; font-size: 14px; font-weight: 500; }
        .wallet-amount { color: #ffca28; font-size: 18px; font-weight: 700; text-shadow: 0 0 10px rgba(255,202,40,0.2); }

        /* Khung đếm ngược thời gian ở giữa */
        .timer-container {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .timer-circle {
            font-size: 32px;
            font-weight: 800;
            color: #ff3d00;
            text-shadow: 0 0 15px rgba(255,61,0,0.4);
            animation: pulse 1s infinite alternate;
        }
        
        .timer-label {
            font-size: 12px;
            color: #656999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* Khu vực hiển thị Xúc xắc (Bát Đĩa) */
        .plate-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: radial-gradient(circle, #222543 0%, #15172b 100%);
            height: 110px;
            border-radius: 50%;
            width: 200px;
            margin: 0 auto 25px auto;
            border: 4px solid #323765;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6), 0 10px 20px rgba(0,0,0,0.4);
            position: relative;
        }

        .dice {
            width: 42px;
            height: 42px;
            background: #fff;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            padding: 4px;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.3), 0 5px 10px rgba(0,0,0,0.5);
            transition: all 0.4s ease;
        }

        .dot { background: #222; border-radius: 50%; width: 7px; height: 7px; margin: auto; }
        .red-dot { background: #d32f2f; width: 9px; height: 9px; }

        /* Lớp phủ úp bát bảo mật (Chờ hết giờ mới mở) */
        .bowl-cover {
            position: absolute;
            top: -4px; left: -4px; right: -4px; bottom: -4px;
            background: radial-gradient(circle, #3a3f6d 0%, #1e213a 100%);
            border: 4px solid #484e85;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #a5a9df;
            font-size: 14px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.5);
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
            z-index: 5;
        }

        .bowl-cover.open {
            transform: translateY(-80px) scale(0.9);
            opacity: 0;
            pointer-events: none;
        }

        @keyframes shake {
            0% { transform: translate(3px, 3px) rotate(0deg); }
            20% { transform: translate(-3px, -2px) rotate(-5deg); }
            40% { transform: translate(-1px, 2px) rotate(5deg); }
            60% { transform: translate(2px, -3px) rotate(0deg); }
            80% { transform: translate(-2px, 2px) rotate(-5deg); }
            100% { transform: translate(2px, -2px) rotate(5deg); }
        }
        .shaking { animation: shake 0.1s infinite; }

        /* Hai Cửa Đặt Lớn: XỈU - TÀI */
        .gate-container {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

            flex: 1;
            background:
